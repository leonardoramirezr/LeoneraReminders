<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#F5841F"/>
    </linearGradient>
    <linearGradient id="mane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C2541B"/>
      <stop offset="1" stop-color="#8F3311"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1D6"/>
      <stop offset="1" stop-color="#FFD9A3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7A2A00" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6B2400" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Mane: 12 lobes, one per hour -->
  <g filter="url(#shadow)">
    <g fill="url(#mane)" transform="translate(512 532)">
      <circle r="268"/>
      <circle cx="0" cy="-262" r="84"/>
      <circle cx="0" cy="-262" r="84" transform="rotate(30)"/>
      <circle cx="0" cy="-262" r="84" transform="rotate(60)"/>
      <circle cx="0" cy="-262" r="84" transform="rotate(90)"/>
      <circle cx="0" cy="-262" r="84" transform="rotate(120)"/>
      <circle cx="0" cy="-262" r="84" transform="rotate(150)"/>
      <circle cx="0" cy="-262" r="84" transform="rotate(180)"/>
      <circle cx="0" cy="-262" r="84" transform="rotate(210)"/>
      <circle cx="0" cy="-262" r="84" transform="rotate(240)"/>
      <circle cx="0" cy="-262" r="84" transform="rotate(270)"/>
      <circle cx="0" cy="-262" r="84" transform="rotate(300)"/>
      <circle cx="0" cy="-262" r="84" transform="rotate(330)"/>
    </g>
  </g>
  <!-- Hour marks on 12, 3, 6, 9 -->
  <g fill="#FFD27A" transform="translate(512 532)">
    <rect x="-13" y="-318" width="26" height="62" rx="13"/>
    <rect x="-13" y="-318" width="26" height="62" rx="13" transform="rotate(90)"/>
    <rect x="-13" y="-318" width="26" height="62" rx="13" transform="rotate(180)"/>
    <rect x="-13" y="-318" width="26" height="62" rx="13" transform="rotate(270)"/>
  </g>
  <!-- Ears -->
  <g filter="url(#soft)">
    <circle cx="384" cy="388" r="62" fill="url(#face)"/>
    <circle cx="640" cy="388" r="62" fill="url(#face)"/>
  </g>
  <circle cx="384" cy="392" r="32" fill="#F2A55B"/>
  <circle cx="640" cy="392" r="32" fill="#F2A55B"/>
  <!-- Face -->
  <path filter="url(#soft)" fill="url(#face)" d="M512 368 C 628 368 704 438 704 540 C 704 650 616 738 512 738 C 408 738 320 650 320 540 C 320 438 396 368 512 368 Z"/>
  <!-- Eyes -->
  <ellipse cx="440" cy="530" rx="24" ry="30" fill="#3B1C0C"/>
  <ellipse cx="584" cy="530" rx="24" ry="30" fill="#3B1C0C"/>
  <circle cx="448" cy="519" r="8" fill="#FFFFFF"/>
  <circle cx="592" cy="519" r="8" fill="#FFFFFF"/>
  <!-- Muzzle -->
  <circle cx="474" cy="646" r="56" fill="#FFF8EC"/>
  <circle cx="550" cy="646" r="56" fill="#FFF8EC"/>
  <g fill="#E3A266">
    <circle cx="452" cy="640" r="7"/><circle cx="476" cy="664" r="7"/><circle cx="446" cy="672" r="7"/>
    <circle cx="572" cy="640" r="7"/><circle cx="548" cy="664" r="7"/><circle cx="578" cy="672" r="7"/>
  </g>
  <!-- Nose -->
  <path fill="#5A2410" d="M470 594 C 470 578 554 578 554 594 C 554 612 528 632 512 632 C 496 632 470 612 470 594 Z"/>
  <path d="M512 632 L 512 660" stroke="#5A2410" stroke-width="10" stroke-linecap="round"/>
</svg>
