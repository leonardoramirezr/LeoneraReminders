<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3A78"/>
      <stop offset="1" stop-color="#121A3D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9A2E"/>
      <stop offset="1" stop-color="#FFD25A"/>
    </linearGradient>
    <linearGradient id="tuft" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#C9631E"/>
      <stop offset="1" stop-color="#8E3A12"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Clock ring, open at top-right where the tail escapes -->
  <circle cx="500" cy="540" r="290" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="40"/>
  <path d="M 689 320 A 290 290 0 1 0 788 500" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Minute dots -->
  <g fill="#FFFFFF" fill-opacity="0.35" transform="translate(500 540)">
    <circle cy="-222" r="11"/><circle cy="-222" r="11" transform="rotate(90)"/>
    <circle cy="-222" r="11" transform="rotate(180)"/><circle cy="-222" r="11" transform="rotate(270)"/>
  </g>
  <!-- Check that becomes a lion's tail -->
  <g filter="url(#glow)">
    <path d="M 360 548 L 466 652 C 540 568 600 480 650 404 C 690 344 716 300 756 276 C 790 256 824 262 834 290" fill="none" stroke="url(#gold)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tail tuft -->
    <path transform="translate(834 290) rotate(84) scale(0.86)" fill="url(#tuft)" d="M -14 -26 C 16 -50 64 -54 96 -34 C 108 -28 116 -26 128 -30 C 122 -20 122 -12 128 -6 C 136 -6 144 -2 148 4 C 138 6 130 12 128 20 C 120 22 114 28 112 36 C 104 32 98 34 92 40 C 62 58 18 52 -14 26 C -24 10 -24 -10 -14 -26 Z"/>
  </g>
</svg>
