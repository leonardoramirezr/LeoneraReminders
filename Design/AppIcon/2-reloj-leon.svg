<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7774A"/>
      <stop offset="1" stop-color="#DC3B26"/>
    </linearGradient>
    <linearGradient id="mane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD36B"/>
      <stop offset="1" stop-color="#FFAA3B"/>
    </linearGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF0E6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#8A1C08" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- Feet -->
    <g stroke="#FFFFFF" stroke-width="44" stroke-linecap="round">
      <line x1="340" y1="790" x2="306" y2="836"/>
      <line x1="684" y1="790" x2="718" y2="836"/>
    </g>
    <!-- Mane ring -->
    <g fill="url(#mane)" transform="translate(512 548)">
      <circle r="300"/>
      <circle cy="-292" r="52"/><circle cy="-292" r="52" transform="rotate(22.5)"/>
      <circle cy="-292" r="52" transform="rotate(45)"/><circle cy="-292" r="52" transform="rotate(67.5)"/>
      <circle cy="-292" r="52" transform="rotate(90)"/><circle cy="-292" r="52" transform="rotate(112.5)"/>
      <circle cy="-292" r="52" transform="rotate(135)"/><circle cy="-292" r="52" transform="rotate(157.5)"/>
      <circle cy="-292" r="52" transform="rotate(180)"/><circle cy="-292" r="52" transform="rotate(202.5)"/>
      <circle cy="-292" r="52" transform="rotate(225)"/><circle cy="-292" r="52" transform="rotate(247.5)"/>
      <circle cy="-292" r="52" transform="rotate(270)"/><circle cy="-292" r="52" transform="rotate(292.5)"/>
      <circle cy="-292" r="52" transform="rotate(315)"/><circle cy="-292" r="52" transform="rotate(337.5)"/>
    </g>
    <!-- Ears as alarm bells -->
    <circle cx="318" cy="290" r="74" fill="#FFFFFF"/>
    <circle cx="706" cy="290" r="74" fill="#FFFFFF"/>
    <!-- Clock body -->
    <circle cx="512" cy="548" r="262" fill="url(#dial)"/>
  </g>
  <circle cx="318" cy="290" r="36" fill="#F8936A"/>
  <circle cx="706" cy="290" r="36" fill="#F8936A"/>
  <!-- Hour ticks -->
  <g fill="#FBC3A8" transform="translate(512 548)">
    <rect x="-12" y="-236" width="24" height="48" rx="12"/>
    <rect x="-12" y="-236" width="24" height="48" rx="12" transform="rotate(90)"/>
    <rect x="-12" y="-236" width="24" height="48" rx="12" transform="rotate(270)"/>
    <rect x="-12" y="-236" width="24" height="48" rx="12" transform="rotate(180)"/>
  </g>
  <!-- Eyes -->
  <circle cx="436" cy="486" r="27" fill="#3A1A10"/>
  <circle cx="588" cy="486" r="27" fill="#3A1A10"/>
  <circle cx="445" cy="476" r="9" fill="#FFFFFF"/>
  <circle cx="597" cy="476" r="9" fill="#FFFFFF"/>
  <!-- Hands = whiskers (about 8:20) -->
  <g stroke="#E2492B" stroke-width="24" stroke-linecap="round">
    <line x1="512" y1="572" x2="410" y2="612"/>
    <line x1="512" y1="572" x2="632" y2="618"/>
  </g>
  <!-- Smile -->
  <path d="M 472 628 C 484 652 506 652 512 628 C 518 652 540 652 552 628" fill="none" stroke="#3A1A10" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hub = nose -->
  <path fill="#3A1A10" d="M466 556 C 466 538 558 538 558 556 C 558 578 530 600 512 600 C 494 600 466 578 466 556 Z"/>
</svg>
